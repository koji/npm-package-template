version: 2.1

jobs:
  build-and-test:
    docker:
      - image: cimg/node:24.x
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-deps-{{ checksum "package-lock.json" }}
      - run:
          name: Install dependencies
          command: npm ci
      - save_cache:
          key: npm-deps-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Lint
          command: npm run lint
      - run:
          name: Typecheck
          command: npm run typecheck
      - run:
          name: Build
          command: npm run build
      - run:
          name: Test
          command: npm test

workflows:
  build-and-test:
    jobs:
      - build-and-test
